<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>目前離線｜金門總兵署遊客指南</title>
    <meta name="theme-color" content="#9a3b2e" />

    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f1e6;
        color: #2b2724;

        padding: 24px;
      }
      main { max-width: 30rem; text-align: center; }
      .badge {
        display: inline-grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: #9a3b2e;
        color: #f7f1e6;
        font-size: 30px;
        margin-bottom: 18px;
      }
      h1 { font-size: 1.4rem; margin: 0 0 12px; }
      p { line-height: 1.8; color: #5b5248; margin: 0 0 20px; }
      a {
        display: inline-block;
        background: #9a3b2e;
        color: #fff;
        text-decoration: none;
        padding: 12px 22px;
        border-radius: 999px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge" aria-hidden="true">署</div>
      <h1>目前沒有網路連線</h1>

        你已離線。清金門鎮總兵署的開放時間為每日 09:00–22:00、免費參觀，地址是金門縣金城鎮北門里浯江街53號。恢復連線後即可查看地圖與最新資訊。

      <a href="/">返回首頁</a>
